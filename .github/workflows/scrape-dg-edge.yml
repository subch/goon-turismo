name: Sync player stats (GT-GridStats + dg-edge)

on:
  schedule:
    # Every 6 hours.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Sync from GT-GridStats (primary, PSN-keyed, no login needed)
        env:
          GT_GRIDSTATS_TOKEN: ${{ secrets.GT_GRIDSTATS_TOKEN }}
        run: npm run scrape:gridstats

      - name: Scrape dg-edge.com (event listing + fallback aggregate stats)
        run: npm run scrape:dg-edge

      - name: Commit data changes
        run: |
          git config user.name "goon-turismo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/players.json data/official-events data/results/official.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync player stats (GT-GridStats + dg-edge)"
            git push
          fi
