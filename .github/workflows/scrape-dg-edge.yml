name: Sync events (dg-edge)

# Runs every 6 hours to pick up new/updated Time Trial listings quickly.
# Deliberately does NOT call the real GT-GridStats token API
# (scrape:gridstats) -- that account is capped at 5 requests/day, and this
# workflow's 4x/day cadence would blow through the whole quota by itself.
# The token API only runs from scrape-gridstats-web.yml, once/day (2
# requests/run). See that workflow's header comment for the full picture.
#
# verify:data always runs last, after the commit/push, so a problem it
# finds never blocks or loses a scrape -- it just fails the Actions run so
# it's visible instead of silently piling up unnoticed.

# The schedule is gone: this sync now runs on the VPS, in the `goon` stack,
# which scrapes and then rebuilds and republishes the site locally instead of
# waiting on a hosted runner. Leaving the cron here as well would have both
# machines scraping and pushing every six hours.
#
# workflow_dispatch is kept deliberately, so this still works as a manual
# fallback if the box is ever down or being rebuilt.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Scrape dg-edge.com (event listing + fallback aggregate stats)
        run: npm run scrape:dg-edge

      - name: Commit data changes
        run: |
          git config user.name "goon-turismo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/players.json data/official-events data/results/official.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync events (dg-edge)"
            git push
          fi

      - name: Verify data integrity
        run: npm run verify:data
