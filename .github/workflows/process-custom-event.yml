name: Process custom event submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'custom-event')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Parse and record submission
        id: process
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: npm run process:issue-result

      - name: Commit result data
        run: |
          git config user.name "goon-turismo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/custom-events data/results/custom.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add custom event results from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Comment and close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ Got it — results recorded and the site will update on the next deploy (usually within a few minutes). Closing this out.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ I couldn't parse this submission automatically (check the Action log). Someone will need to fix the format and re-submit, or edit the data files by hand.",
            });
