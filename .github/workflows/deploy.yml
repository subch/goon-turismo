name: Build and deploy site

# GitHub deliberately does NOT fire `on: push` workflows for commits pushed
# by another Action using the default GITHUB_TOKEN (anti-recursion
# safeguard) -- so the data-sync workflows' commits were never triggering a
# rebuild, and the live site sat stale at whatever a human last pushed. The
# workflow_run trigger below covers that: it fires once either sync workflow
# finishes, regardless of which token did the pushing.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - "Sync events (dg-edge)"
      - "Sync player and event data (GT-GridStats)"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
