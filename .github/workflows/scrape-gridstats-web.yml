name: Sync player and event data (GT-GridStats)

# Runs every 6 hours (offset 30 min from scrape-dg-edge.yml's :17 so the two
# don't usually race on the same push) -- results only ever come from
# GT-GridStats' public event-history pages, and a player who sets a time
# right after one sync used to wait up to 24h for the next. Every 6h caps
# that lag much tighter, and this scraping is free/unmetered (be polite,
# not quota-limited) so there's no cost to running it this often.
#
# Two complementary GT-GridStats sources:
#   1. scrape-gridstats-web.mjs -- scrapes public /player/{psn} pages for
#      event/result history (the real token API has no event-listing or
#      per-event-leaderboard endpoint, so this stays even with a token set).
#      Runs every firing.
#   2. scrape-gridstats.mjs -- uses the real token-based /api/racers endpoint
#      for richer, authoritative DR/SR/stats, overwriting step 1's rougher
#      DR/SR guess for the same players. That account is capped at 5
#      requests/day (2 used per run), so this step only runs on the 06:47
#      UTC firing -- once/day, regardless of DST (a fixed UTC hour, unlike
#      the old "is it midnight Central" check, sidesteps DST entirely since
#      this only needs to land once a day, not exactly at midnight).
#
# Step 3 (verify:data) always runs last, after the commit/push, so a
# problem it finds never blocks or loses a scrape -- it just fails the
# Actions run so it's visible instead of silently piling up for days like
# the last two duplicate-event incidents did.

# The schedule is gone: this sync now runs on the VPS, in the `goon` stack,
# which scrapes and then rebuilds and republishes the site locally instead of
# waiting on a hosted runner. Leaving the cron here as well would have both
# machines scraping and pushing every six hours.
#
# workflow_dispatch is kept deliberately, so this still works as a manual
# fallback if the box is ever down or being rebuilt.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Scrape GT-GridStats public pages (events, results, fallback stats)
        run: npm run scrape:gridstats-web

      - name: Check whether this is today's one real-API run (fixed UTC hour, quota-limited)
        id: real_api_check
        run: |
          hour=$(date -u +%H)
          if [ "$hour" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync richer player stats from the real GT-GridStats API
        if: steps.real_api_check.outputs.run == 'true'
        env:
          GT_GRIDSTATS_TOKEN: ${{ secrets.GT_GRIDSTATS_TOKEN }}
        run: npm run scrape:gridstats

      - name: Commit data changes
        run: |
          git config user.name "goon-turismo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/players.json data/official-events data/results/official.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync player and event data (GT-GridStats)"
            git push
          fi

      - name: Verify data integrity
        run: npm run verify:data
