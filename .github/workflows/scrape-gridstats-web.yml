name: Sync player and event data (GT-GridStats)

# Two complementary GT-GridStats sources, run back to back:
#   1. scrape-gridstats-web.mjs -- scrapes public /player/{psn} pages for
#      event/result history (the real token API has no event-listing or
#      per-event-leaderboard endpoint, so this stays even with a token set).
#   2. scrape-gridstats.mjs -- uses the real token-based /api/racers endpoint
#      for richer, authoritative DR/SR/stats, overwriting step 1's rougher
#      DR/SR guess for the same players. No-ops (exits 0) if
#      GT_GRIDSTATS_TOKEN isn't set.
#
# Step 2's account is capped at 5 requests/day -- with 24 players and a
# batch size of 16, one run costs 2 requests. Don't add more scheduled runs
# of this workflow per day without checking that math still holds.

on:
  schedule:
    # GitHub Actions cron only understands UTC, so we can't express "midnight
    # Central" directly -- 05:00 UTC is midnight during Central Daylight Time
    # (~Mar-Nov), 06:00 UTC is midnight during Central Standard Time
    # (~Nov-Mar). Both fire every day; the "check local time" step below only
    # lets the job actually run on whichever one currently lines up with
    # local midnight, so this still runs once per day.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch: {} # manual refresh from the Actions tab, any time

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Only proceed at actual midnight Central (skip the non-matching DST cron)
        if: github.event_name == 'schedule'
        run: |
          hour=$(TZ=America/Chicago date +%H)
          if [ "$hour" != "00" ]; then
            echo "Not midnight in America/Chicago right now (local hour: $hour) -- skipping this trigger."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: 20

      - run: npm ci
        if: env.SKIP != 'true'

      - name: Scrape GT-GridStats public pages (events, results, fallback stats)
        if: env.SKIP != 'true'
        run: npm run scrape:gridstats-web

      - name: Sync richer player stats from the real GT-GridStats API
        if: env.SKIP != 'true'
        env:
          GT_GRIDSTATS_TOKEN: ${{ secrets.GT_GRIDSTATS_TOKEN }}
        run: npm run scrape:gridstats

      - name: Commit data changes
        if: env.SKIP != 'true'
        run: |
          git config user.name "goon-turismo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/players.json data/official-events data/results/official.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync player and event data (GT-GridStats)"
            git push
          fi
