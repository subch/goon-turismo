name: Process tune submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'tune-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Parse and record tune
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/process-tune-submission.mjs

      - name: Commit tune data
        run: |
          git config user.name "goon-turismo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tunes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add tune submission from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Comment and close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ Tune added to the site. Closing this out.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ Couldn't parse this tune submission automatically (check the Action log). Please fix the format and re-submit.",
            });
