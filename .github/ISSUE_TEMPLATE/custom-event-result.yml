name: Submit event results
description: Log results for a custom group event, OR an official dg-edge.com Time Trial (dg-edge usually won't show our times automatically -- see below).
title: "[Event Results] "
labels: ["custom-event"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for **custom group events** AND for **official dg-edge Time Trials** --
        dg-edge only shows our results automatically for whoever's logged into their own
        account there, so official-event times mostly need to come through here too.
        If this is another round of an event you already submitted, use the *exact same
        Event name* so results get grouped together.
  - type: input
    id: dg_edge_url
    attributes:
      label: Official dg-edge event link (optional)
      description: >
        Only fill this in if this is results for an OFFICIAL dg-edge Time Trial (e.g.
        https://www.dg-edge.com/events/time-trials/630). Leave blank for a custom group event.
      placeholder: "https://www.dg-edge.com/events/time-trials/630"
    validations:
      required: false
  - type: input
    id: event_name
    attributes:
      label: Event name
      description: For an official event this can just be the track/car name -- it'll be cross-checked against the dg-edge link above.
      placeholder: "Friday Night Drags - Round 3"
    validations:
      required: true
  - type: input
    id: track
    attributes:
      label: Track
      placeholder: "Tokyo Expressway - South Outer Loop"
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car / class (optional)
      placeholder: "Open lobby, or e.g. Gr.3"
    validations:
      required: false
  - type: input
    id: event_date
    attributes:
      label: Date (YYYY-MM-DD)
      placeholder: "2026-08-16"
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: >
        One line per driver, format: `psn: time`. Time can be `m:ss.mmm` or `ss.mmm`.
        Drivers who ran but didn't set a clean time can just be listed with no time.
      placeholder: |
        superpharts: 1:23.456
        friend2psn: 1:24.001
        friend3psn: DNF
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      placeholder: "Anything worth remembering about this one."
    validations:
      required: false
