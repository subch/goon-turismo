name: Submit event results
description: Log results for a custom group event, or an official GT7 Time Trial time the automatic GT-GridStats sync missed.
title: "[Event Results] "
labels: ["custom-event"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for **custom group events** (our own lobbies), and for an **official Time Trial**
        when someone's time is missing from the site -- official times are normally picked up
        automatically from GT-GridStats within six hours, so only reach for this if a driver isn't
        indexed there. If this is another round of an event you already submitted, use the
        *exact same Event name* so results get grouped together.
  - type: dropdown
    id: official
    attributes:
      label: Official GT7 Time Trial?
      description: Choose "Yes" only for one of the game's official Time Trials. Results then attach to the site's record of that Time Trial (matched on track and date).
      options:
        - "No - custom group event"
        - "Yes - official Time Trial"
      default: 0
    validations:
      required: true
  - type: input
    id: event_name
    attributes:
      label: Event name
      description: For an official Time Trial this can just be the track name.
      placeholder: "Friday Night Drags - Round 3"
    validations:
      required: true
  - type: input
    id: track
    attributes:
      label: Track
      description: For an official Time Trial, spell it the way GT7 does (e.g. "Circuit de Spa-Francorchamps") so it matches the synced record.
      placeholder: "Tokyo Expressway - South Outer Loop"
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car / class (optional)
      placeholder: "Open lobby, or e.g. Gr.3"
    validations:
      required: false
  - type: input
    id: event_date
    attributes:
      label: Date (YYYY-MM-DD)
      description: For an official Time Trial, its start or end date.
      placeholder: "2026-08-16"
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: >
        One line per driver, format: `psn: time`. Time can be `m:ss.mmm` or `ss.mmm`.
        Drivers who ran but didn't set a clean time can just be listed with no time.
      placeholder: |
        superpharts: 1:23.456
        friend2psn: 1:24.001
        friend3psn: DNF
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      placeholder: "Anything worth remembering about this one."
    validations:
      required: false
